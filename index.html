    <meta property="og:type" content="website" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      /* Shown from the first byte until the game replaces it. */
      html, body { margin: 0; background: #060b14; }
      .fc-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(ellipse at 50% 120%, rgba(245, 140, 40, 0.16), transparent 60%), #060b14;
        font: 600 14px/1 system-ui, sans-serif; letter-spacing: 0.32em; color: #f5b13d; }
      .fc-boot i { display: block; width: 160px; height: 2px; overflow: hidden; background: rgba(27, 44, 71, 0.9); border-radius: 2px; }
      .fc-boot i::after { content: ''; display: block; width: 40%; height: 100%; background: #38d6f5; animation: fc-boot 1.1s ease-in-out infinite; }
      @keyframes fc-boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .fc-boot i::after { animation: none; width: 100%; opacity: 0.5; } }
    </style>
  </head>
  <body class="bg-ops-bg">
    <div id="root"><div class="fc-boot" role="status" aria-label="Loading Forge Command">FORGE COMMAND<i></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
